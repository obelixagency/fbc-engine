name: Covers (one-off fixes and inspection)
on:
  workflow_dispatch:
    inputs:
      inspect_id:
        description: "Queue item id to inspect (empty = set hook covers on published Shorts)"
        required: false
concurrency:
  group: covers
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - uses: actions/checkout@v4
        with:
          repository: obelixagency/fbc-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content
      - env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          INSPECT_ID: ${{ inputs.inspect_id }}
        run: |
          if [ -n "$INSPECT_ID" ]; then
            python -m fbc.cli inspect --id "$INSPECT_ID"
          else
            python -m fbc.cli covers
          fi

