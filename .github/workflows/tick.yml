name: Tick (produce what's due soon, publish what's due now)
# GitHub's cron is unreliable for this repo (on Oct 19 only 1 of ~20 scheduled runs fired), so the tick does not
# depend on it: one run loops for ~5h20m (a tick every 10 min, analytics once a day) and then starts the next
# run itself. The cron below is only a backup that restarts the loop if the chain ever breaks.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no uploads, no renders)"
        type: boolean
        default: false
concurrency:
  group: tick
  cancel-in-progress: false
permissions:
  contents: read
  actions: write          # lets the loop start its own next run
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Cache HyperFrames and its browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes
          key: hf-0.8.170-${{ runner.os }}
      - name: Keep finished voice lines between ticks (TTS quota stops resume, not restart)
        uses: actions/cache@v4
        with:
          path: work/**/voice
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - run: npx -y hyperframes@0.8.170 browser ensure
      - name: Check out private content
        uses: actions/checkout@v4
        with:
          repository: obelixagency/fbc-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content
      - name: Check out public media host
        uses: actions/checkout@v4
        with:
          repository: obelixagency/fbc-media
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: media
      - name: Tick loop
        env:
          LOOP_MINUTES: ${{ inputs.dry_run && '0' || '320' }}
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            git -C content pull -q --rebase || true
            git -C media pull -q --rebase || true
            python -m fbc.cli tick ${{ inputs.dry_run && '--dry-run' || '' }} || echo "[fbc] tick_failed {}"
            if [ "$(date -u +%H)" = "12" ] && [ ! -f "work/analytics-$(date -u +%F)" ]; then
              mkdir -p work && touch "work/analytics-$(date -u +%F)"
              git -C content pull -q --rebase || true
              python -m fbc.cli analytics || echo "[fbc] analytics_failed {}"
            fi
            [ "$(date +%s)" -ge "$end" ] && break
            sleep $(( 600 - $(date +%s) % 600 ))
          done
      - name: Start the next loop
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/tick.yml/dispatches" -f ref=main
