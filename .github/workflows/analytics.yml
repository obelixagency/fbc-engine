name: Analytics (score videos after 72 h, re-weight formats)
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
concurrency:
  group: tick              # never runs at the same time as a tick (both write the queue)
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - uses: actions/checkout@v4
        with:
          repository: obelixagency/fbc-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content
      - env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -m fbc.cli analytics
