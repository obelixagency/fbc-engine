name: Generate weekly batch (opens a review PR in fbc-content)
on:
  schedule:
    - cron: "0 7 * * 5"        # Friday 10:00 Cairo
    - cron: "0 17 * * 0"       # Sunday 20:00 Cairo: reminder if the PR is still open
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to generate, e.g. 2026-W45 (empty = next week)"
        required: false
      dry_run:
        description: "Dry run (write the batch to work/dry instead of opening a PR)"
        type: boolean
        default: false
concurrency:
  group: generate
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - uses: actions/checkout@v4
        with:
          repository: obelixagency/fbc-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content
      - name: Generate
        if: github.event.schedule != '0 17 * * 0'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
        run: python -m fbc.cli generate ${{ inputs.week && format('--week {0}', inputs.week) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Sunday reminder
        if: github.event.schedule == '0 17 * * 0'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: python -m fbc.cli remind
