[project]
name = "fbc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "jinja2>=3.1", "python-dateutil>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: renders real video (needs node + chromium + ffmpeg)", "real_page_token: exercises the real Page-token lookup (with a mocked Graph)"]
addopts = "-m 'not slow'"

[tool.setuptools.packages.find]
include = ["fbc*"]
